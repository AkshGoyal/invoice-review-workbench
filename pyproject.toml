[project]
name = "invoice-review-workbench"
version = "0.1.0"
description = "Supplier invoice PDF to an evidence-backed AP review recommendation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pillow>=11.0",
    "rapidfuzz>=3.10",
    "reportlab>=4.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
